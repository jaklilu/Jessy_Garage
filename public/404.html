<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 — Page Not Found | Jessy Garage Doors</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap");
      *,*::before,*::after{box-sizing:border-box}
      body{
        margin:0;
        font-family:"Source Sans 3",system-ui,sans-serif;
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center;
        padding:2rem 1rem;
        background:linear-gradient(115deg,rgba(10,22,40,.88) 0%,rgba(13,45,107,.72) 55%,rgba(196,30,42,.45) 100%);
        color:#fff;
      }
      h1{
        font-family:"Barlow Condensed",sans-serif;
        font-size:clamp(6rem,20vw,12rem);
        font-weight:800;
        line-height:1;
        margin:0 0 .25rem;
        background:linear-gradient(135deg,#fff 0%,#c4c4c4 100%);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
        background-clip:text;
      }
      .title{
        font-family:"Barlow Condensed",sans-serif;
        font-size:clamp(1.5rem,4vw,2.25rem);
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.04em;
        margin:0 0 .5rem;
      }
      .message{
        font-size:1.1rem;
        color:rgba(255,255,255,.85);
        margin:0 0 2rem;
        max-width:24rem;
      }
      .btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        padding:.85rem 1.5rem;
        border:none;
        border-radius:6px;
        font-family:"Barlow Condensed",sans-serif;
        font-size:1.15rem;
        font-weight:700;
        letter-spacing:.06em;
        text-transform:uppercase;
        text-decoration:none;
        background:#c41e2a;
        color:#fff;
        box-shadow:0 8px 24px rgba(196,30,42,.35);
        transition:transform .25s,background .25s;
      }
      .btn:hover{transform:translateY(-2px);background:#a3181f}
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p class="title">Page not found</p>
    <p class="message">Sorry, the page you are looking for does not exist.</p>
    <a href="/en" class="btn">Back to home</a>
  </body>
</html>
